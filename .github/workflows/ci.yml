name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Optional Groq integration test
        if: ${{ env.GROQ_API_KEY != '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_GROQ_TESTS: 1
        run: npm test -- --testPathPattern=groq.integration
